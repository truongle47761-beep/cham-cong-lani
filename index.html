<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Bảng Chấm Công Của Mỹ</title>
<style>body{font-family:-apple-system;background:#fff1f7;padding:20px}h1{color:#db2777}.card{background:white;padding:16px;border-radius:18px;margin-bottom:16px;box-shadow:0 4px 12px rgba(0,0,0,.08)}input,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #f9a8d4}button{width:100%;padding:14px;border:none;border-radius:999px;background:#ec4899;color:white;font-weight:bold}.item{background:#fde7f3;padding:10px;border-radius:12px;margin:8px 0}</style></head>
<body>
<h1>🌸 BẢNG CHẤM CÔNG CỦA MỸ 🌸</h1>
<div class='card'>
<input id='date' type='date'>
<input id='start' type='time'>
<input id='end' type='time'>
<textarea id='note' placeholder='Ghi chú'></textarea>
<input id='ship' placeholder='1₫5,2₫5,1₫2'>
<button onclick='save()'>💾 Lưu ca</button>
</div>
<div class='card'><h3>📋 Danh sách</h3><div id='list'></div></div>
<div class='card'><h3>🧮 Tổng kết</h3><p id='sum'></p></div>
<script>
let data=JSON.parse(localStorage.getItem('myv5')||'[]');
function ship(v = '') {
  let total = 0;
  v = v.replace(/\s/g, '');

  v.split(',').forEach(item => {
    const m = item.match(/(\d+)[₫đ](\d+)/i);
    if (m) {
      total += Number(m[1]) * Number(m[2]) * 1000;
    }
  });

  return total;
}
function dur(s,e){let[a,b]=s.split(':').map(Number),[c,d]=e.split(':').map(Number);let x=a*60+b,y=c*60+d;if(y<x)y+=1440;return y-x}
function render(){let list=document.getElementById('list');list.innerHTML='';let min=0,st=0;
data.forEach((r,i)=>{let m=dur(r.start,r.end);min+=m;st+=ship(r.ship);list.innerHTML+=`<div class=item><b>${r.date}</b><br>🕒 ${r.start} → ${r.end}<br>⏱️ ${Math.floor(m/60)} giờ ${m%60} phút<br>📊 ${(m/60).toFixed(2).replace('.',',')} giờ công<br>🚚 ${ship(r.ship).toLocaleString('vi-VN')}đ (${r.ship||''})<br>📝 ${r.note||''}<br><button onclick='del(${i})'>🗑️ Xóa</button></div>`});document.getElementById('sum').innerHTML=`⏱️ ${Math.floor(min/60)} giờ ${min%60} phút<br>📊 ${(min/60).toFixed(2).replace('.',',')} giờ công<br>🚚 ${st.toLocaleString('vi-VN')}đ`}
function save(){data.push({date:date.value,start:start.value,end:end.value,note:note.value,ship:ship.value});localStorage.setItem('myv5',JSON.stringify(data));render()}
function del(i){data.splice(i,1);localStorage.setItem('myv5',JSON.stringify(data));render()}
render();
</script></body></html>
